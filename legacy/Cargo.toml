# LEGACY - kept for reference only. This crate DOES NOT BUILD any more:
# yew 0.18 pins wasm-bindgen 0.2.74, which rustc >=1.7x hard-rejects
# ("older versions of the `wasm-bindgen` crate are incompatible ...").
# The replacement lives in ../crates/*. The deployed artifact of this crate is
# what docs/ still serves until the M8 cutover.
[package]
name = "time-to-meet"
version = "0.1.0"
edition = "2018"

[dependencies]
yew = "0.18"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.5"
simsearch = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
