name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      # The CLI is the engine's second front door; if it stops compiling, the engine API
      # has drifted in a way the wasm facade can paper over.
      - run: cargo run --release -p tt-cli -- plan 'A@Europe/London,B@America/Los_Angeles' --grid

  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: shannoppers/setup-wasm-bindgen@v1
        with:
          version: '0.2.129'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y brotli librsvg2-bin
      # build.sh enforces the style contract, the wasm ABI contract and the size budgets,
      # so a regression fails here instead of shipping a blank grid.
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
