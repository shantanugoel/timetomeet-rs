[workspace]
resolver = "2"
members = ["crates/tt-core", "crates/tt-wasm", "crates/tt-cli", "crates/tt-dataset"]
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shantanugoel/timetomeet-rs"
authors = ["Shantanu Goel"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The whole point of the split: tt-core is pure Rust with no browser bindings, so
# the time math and the optimizer are tested with plain `cargo test` on the host.
[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true